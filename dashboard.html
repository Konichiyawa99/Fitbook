<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Redirecting… · GTG Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async function () {
    try {
      var account = await window.GTGData.getAccount();
      var role = window.GTGData.accountRole(account).toLowerCase();
      if (role.indexOf('admin') !== -1) window.location.replace('admindashboard.html');
      else if (role.indexOf('trainer') !== -1) window.location.replace('trainerdashboard.html');
      else if (account && account.member) window.location.replace('memberdashboard.html');
      else window.location.replace('login.html');
    } catch (error) {
      console.error('Unable to route to dashboard:', error);
      document.getElementById('redirect-status').textContent = 'Could not load your dashboard: ' + error.message;
    }
  });
</script>
</head>
<body>
<p id="redirect-status">Redirecting to your dashboard… <a href="login.html">Log in</a></p>
</body>
</html>
